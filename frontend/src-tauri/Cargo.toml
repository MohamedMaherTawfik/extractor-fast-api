[package]
name = "emy-control-center"
version = "1.0.0"
description = "EMY Private AI OS development control center"
authors = ["EMY"]
edition = "2021"

[lib]
name = "emy_control_center_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
