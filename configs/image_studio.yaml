# This configuration intentionally contains no image model or workflow until
# one has been validated against the local ComfyUI installation. Add only
# exact paths, node IDs, inputs, and model files discovered on that machine.
version: 1.0.0
worker_concurrency: 1
upload_timeout_seconds: 300
generation_timeout_seconds: 3600
poll_interval_seconds: 1.0
max_reference_size_bytes: 26214400
max_image_dimension: 12000
comfyui_install_path: null
custom_nodes_path: null
models_path: null
workflows_path: comfyui_image_workflows

# Models opt into a named dimension profile through `dimension_profile`.
# Keeping dimensions outside workflow code allows each future architecture to
# define a GPU-safe launch envelope without changing another model's behavior.
dimension_profiles:
  sd15_gtx1070:
    "1:1": { width: 512, height: 512 }
    "4:5": { width: 512, height: 640 }
    "3:4": { width: 576, height: 768 }
    "9:16": { width: 432, height: 768 }
    "16:9": { width: 768, height: 432 }

models: []
