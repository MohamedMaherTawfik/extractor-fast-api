version: 1.0.0
default_model: wan_video
worker_concurrency: 1
poll_interval_seconds: 1.0
upload_timeout_seconds: 300
generation_timeout_seconds: 3600
max_reference_size_bytes: 26214400
max_reference_dimension: 12000
accepted_output_extensions: [".mp4", ".webm", ".mov", ".gif"]

# The included workflow JSON files are UNVERIFIED/TEMPLATE examples only. They
# are intentionally disabled and cannot make Video Studio generation-ready.
# Replace a template with a real API-format export, set exact model_files and
# required_custom_nodes, then set enabled and verified only after /object_info
# preflight succeeds on the target ComfyUI runtime.
models:
  - model_id: wan_video
    display_name: Wan Video
    workflow_file: wan_video.json
    enabled: false
    verified: false
    fps: 16
    max_duration_seconds: 20
    aspect_ratios: ["1:1", "4:5", "9:16", "16:9"]
    supports_image_reference: true
    output_node_ids: ["30"]
    injections:
      positive_prompt: {node_id: "6", input: text}
      negative_prompt: {node_id: "7", input: text}
      reference_image: {node_id: "10", input: image}
      width: {node_id: "20", input: width}
      height: {node_id: "20", input: height}
      num_frames: {node_id: "20", input: length}
      fps: {node_id: "30", input: frame_rate}
      seed: {node_id: "20", input: seed}
