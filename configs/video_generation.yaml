recipes:
  - recipe_id: EMY_CHARACTER_V1
    name: EMY Character Cinematic V1
    master_prompt: >-
      Create a polished cinematic product video centered on the approved EMY
      character reference. Treat the supplied reference as the immutable visual
      identity source and maintain temporal continuity across the full shot.
    camera_style: premium commercial cinematography, natural lens behavior
    lighting: soft directional key light with controlled highlights and realistic skin tones
    colors: refined warm neutrals with clean product contrast
    environment: coherent premium advertising set appropriate to the idea
    realism_level: photorealistic with natural materials and physically plausible motion
    motion_style: smooth deliberate movement, no sudden pose or wardrobe changes
    negative_prompt:
      - face replacement
      - age change
      - different person
      - hairstyle variation
      - wardrobe mutation
      - plastic skin
      - camera jitter
  - recipe_id: EMY_PRODUCT_BEAUTY_V1
    name: EMY Beauty Product V1
    master_prompt: >-
      Produce an elegant beauty campaign film with a stable hero character and
      precise product-focused blocking. Preserve the reference identity exactly.
    camera_style: macro beauty inserts and a slow hero push-in
    lighting: diffused beauty lighting with glossy controlled product highlights
    colors: cream, champagne, soft rose and clean whites
    environment: minimal luxury skincare studio
    realism_level: high-end photoreal commercial finish
    motion_style: graceful gestures, subtle hair motion and stable product geometry
    negative_prompt: [identity drift, label distortion, waxy skin, oversaturation, flicker]
